<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=1440, initial-scale=1.0" name="viewport"/>
<title>Builder Base V2 — Hero Option B</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    width: 1440px;
    margin: 0 auto;
    background-color: #F4F2ED;
    color: #121317;
    font-family: 'Hanken Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  /* NAVBAR */
  .navbar {
    height: 72px;
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: transparent;
  }

  .nav-left {
    display: flex;
    align-items: center;
    gap: 48px;
  }

  .brand-mark {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: #121317;
  }

  .brand-square {
    width: 6px;
    height: 6px;
    background-color: #2B2F7C;
    flex-shrink: 0;
  }

  .brand-name {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: #121317;
    line-height: 1;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .nav-link {
    font-size: 15px;
    font-weight: 500;
    color: #121317;
    text-decoration: none;
    line-height: 1;
  }

  .nav-right {
    display: flex;
    align-items: center;
  }

  .partners-link {
    font-size: 15px;
    font-weight: 500;
    color: #121317;
    text-decoration: none;
    line-height: 1;
  }

  /* HERO STATEMENT */
  .hero-statement-section {
    padding: 16px 32px 0 32px;
  }

  .statement-line-1 {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    width: 100%;
  }

  .statement-the {
    font-size: 64px;
    font-weight: 600;
    letter-spacing: -0.035em;
    line-height: 0.95;
    color: #121317;
  }

  .statement-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: #5E5B55;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .statement-line-2 {
    width: 100%;
    margin: 4px 0 2px 0;
  }

  .statement-distribution {
    font-size: 196px;
    font-weight: 800;
    letter-spacing: -0.05em;
    line-height: 0.84;
    text-transform: uppercase;
    color: #121317;
    display: block;
    width: 100%;
    text-align: justify;
    text-align-last: justify;
  }

  .statement-line-3 {
    display: flex;
    align-items: center;
    margin-top: 10px;
  }

  .statement-layer {
    font-size: 64px;
    font-weight: 600;
    letter-spacing: -0.035em;
    line-height: 1;
    color: #121317;
  }

  .statement-actions {
    display: flex;
    align-items: center;
    margin-left: 40px;
    gap: 24px;
  }

  .btn-join {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 52px;
    padding: 0 28px;
    background-color: #2B2F7C;
    color: #F4F2ED;
    font-family: 'Hanken Grotesk', sans-serif;
    font-size: 16px;
    font-weight: 500;
    text-decoration: none;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    line-height: 1;
  }

  .partner-link-action {
    font-size: 16px;
    font-weight: 500;
    color: #121317;
    text-decoration: none;
    line-height: 1;
  }

  /* HERO PHOTO */
  .hero-photo-wrapper {
    margin-top: 32px;
    padding: 0 24px;
    margin-bottom: 64px;
  }

  .hero-photo-frame {
    position: relative;
    width: 100%;
    height: 640px;
    border-radius: 20px;
    overflow: hidden;
    background-color: #0E0F13;
  }

  .hero-photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 60% 45%;
    display: block;
  }

  .hero-photo-frame::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 20%;
    background: linear-gradient(to top, rgba(14, 15, 19, 0.45) 0%, transparent 100%);
    pointer-events: none;
  }

  /* CULTURE SECTION */
  .culture-section {
    background-color: #0E0F13;
    padding: 96px 0 96px 32px;
    color: #F4F2ED;
    width: 100%;
    overflow: hidden;
  }

  .culture-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-right: 32px;
    margin-bottom: 48px;
  }

  .culture-title {
    font-size: 112px;
    font-weight: 700;
    line-height: 0.9;
    letter-spacing: -0.04em;
    text-transform: uppercase;
    color: #F4F2ED;
  }

  .culture-title span {
    display: block;
  }

  .culture-meta-stack {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    text-align: right;
    display: flex;
    flex-direction: column;
    gap: 6px;
    line-height: 1.4;
    padding-bottom: 6px;
  }

  .meta-paper {
    color: #F4F2ED;
    letter-spacing: 0.06em;
  }

  .meta-grey {
    color: #9A968E;
    letter-spacing: 0.06em;
  }

  /* GALLERY ACCORDION ROW */
  .culture-row {
    display: flex;
    gap: 8px;
    width: 100%;
    height: 560px;
  }

  .photo-frame {
    height: 560px;
    border-radius: 4px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    background-color: #121317;
  }

  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Frame 01 (Expanded & Active) */
  .frame-01 {
    width: 860px;
  }

  .frame-01 img {
    object-position: 50% 55%;
  }

  .frame-01::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background-color: #F4F2ED;
    z-index: 2;
  }

  .frame-01 .bottom-vignette {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 120px;
    background: linear-gradient(to top, rgba(14, 15, 19, 0.85) 0%, transparent 100%);
    display: flex;
    align-items: flex-end;
    padding: 24px;
    z-index: 2;
  }

  .frame-01 .caption {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #F4F2ED;
  }

  /* Frame 02 (Hover state) */
  .frame-02 {
    width: 180px;
  }

  .frame-02 img {
    object-position: 50% 60%;
  }

  .frame-badge {
    position: absolute;
    top: 20px;
    left: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    z-index: 2;
  }

  .badge-paper {
    color: #F4F2ED;
  }

  .badge-grey {
    color: #9A968E;
  }

  /* Frames 03, 04, 05 (Collapsed slices) */
  .frame-collapsed {
    width: 112px;
  }

  .frame-03 img {
    object-position: 50% 50%;
    filter: grayscale(70%) brightness(0.8);
  }

  .frame-04 img {
    object-position: 40% 60%;
    filter: grayscale(70%) brightness(0.8);
  }

  .frame-05 img {
    object-position: 20% 50%;
    filter: grayscale(70%) brightness(0.8);
  }

  /* INDEX BAR */
  .index-row {
    margin-top: 32px;
    display: flex;
    align-items: center;
    gap: 32px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }

  .index-item {
    color: #9A968E;
    position: relative;
    padding-bottom: 6px;
    letter-spacing: 0.05em;
  }

  .index-item.active {
    color: #F4F2ED;
  }

  .index-item.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2px;
    background-color: #2B2F7C;
  }
</style>
</head>
